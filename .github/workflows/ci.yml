name: Pre-merge CI

on:
  pull_request:
    branches:
      - main
      - 'dev*'

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Format, lint, coverage, tests
    runs-on: ubuntu-24.04
    env:
      DEVCONTAINER_CACHE_REF: ghcr.io/${{ github.repository_owner }}/wavepeek-devcontainer:buildcache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR for devcontainer cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Print runtime provenance
        run: |
          echo "devcontainer_config=.devcontainer/devcontainer.json"
          echo "devcontainer_dockerfile=.devcontainer/Dockerfile"
          sha256sum .devcontainer/devcontainer.json .devcontainer/Dockerfile

      - name: Run checks in devcontainer (cache write)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: |
            type=registry,ref=${{ env.DEVCONTAINER_CACHE_REF }}
          cacheTo: |
            type=registry,ref=${{ env.DEVCONTAINER_CACHE_REF }},mode=max
          push: never
          runCmd: just ci

      - name: Run checks in devcontainer (cache read-only)
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: just ci

      - name: Summarize source coverage
        if: always()
        run: |
          if [ -f tmp/coverage/coverage-src-summary.md ]; then
            cat tmp/coverage/coverage-src-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage summary markdown was not generated" >> "$GITHUB_STEP_SUMMARY"
          fi
