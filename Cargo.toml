[package]
name = "wavepeek"
version = "3.0.1"
edition = "2024"
rust-version = "1.93"
authors = ["esynr3z"]
description = "Command-line tool for RTL waveform inspection with deterministic machine-friendly output."
license = "Apache-2.0"
repository = "https://github.com/kleverhq/wavepeek"
homepage = "https://github.com/kleverhq/wavepeek"
readme = "README.md"
documentation = "https://docs.rs/wavepeek"
keywords = ["rtl", "waveform", "vcd", "fst", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".devcontainer/*",
    ".github/*",
]

[features]
default = []
fsdb = ["ondas/fsdb-lib"]

[dependencies]
clap = { version = "~4", features = ["derive"] }
serde = { version = "~1", features = ["derive"] }
serde_json = "~1"
regex = "~1"
thiserror = "~2"
ondas = { version = "=1.0.0", git = "https://github.com/kleverhq/ondas", rev = "646a536c8ee2793e40c656b43894be8ff4219803" }
include_dir = "~0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[dev-dependencies]
assert_cmd = "~2"
predicates = "~3"
tempfile = "~3"
insta = "~1"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lib]
bench = false
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "wavepeek"
path = "src/main.rs"
bench = false
